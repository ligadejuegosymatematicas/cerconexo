name: Diagnóstico temporal file Clásico
on:
  push:
    branches: [diagnostico/m5a1-teclado-1280]
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CERCONEXO_PLAYWRIGHT_PATH: ${{ runner.temp }}/cerconexo-browser/node_modules/playwright
      CERCONEXO_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preparar Chromium idéntico al CI habitual
        run: |
          npm install --prefix "$RUNNER_TEMP/cerconexo-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/cerconexo-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Preparar candidata exacta y referencia M4.2 sin alterar sus fuentes
        run: |
          git worktree add --detach "$RUNNER_TEMP/cerconexo-candidate" 96c8a470c1c31f3ad552e0998bcdd02e72484954
          git worktree add --detach "$RUNNER_TEMP/cerconexo-m42" 4e02097f632279e137d24fee4e2d9cd809461d4b
          (cd "$RUNNER_TEMP/cerconexo-candidate" && node scripts/check-integrity.mjs && python3 scripts/build_offline.py)
          (cd "$RUNNER_TEMP/cerconexo-m42" && python3 scripts/build_offline.py)
      - name: Doce casos aislados de la candidata
        working-directory: ${{ runner.temp }}/cerconexo-candidate
        env:
          CERCONEXO_PROBE_ROOT: ${{ runner.temp }}/cerconexo-candidate
          CERCONEXO_FILE_AUDIT_OUT: ${{ github.workspace }}/validation/file-audit/candidate
          CERCONEXO_FILE_AUDIT_TAG: isolated
        run: node "$GITHUB_WORKSPACE/diagnostics/file-diagnostic.cjs"
      - name: Doce casos aislados de la referencia anterior a M5-A
        working-directory: ${{ runner.temp }}/cerconexo-m42
        env:
          CERCONEXO_PROBE_ROOT: ${{ runner.temp }}/cerconexo-m42
          CERCONEXO_FILE_AUDIT_OUT: ${{ github.workspace }}/validation/file-audit/m42
          CERCONEXO_FILE_AUDIT_TAG: isolated
        run: node "$GITHUB_WORKSPACE/diagnostics/file-diagnostic.cjs"
      - name: Una ejecución de la suite afectada con auditoría temporal
        working-directory: ${{ runner.temp }}/cerconexo-candidate
        env:
          CERCONEXO_PROBE_ROOT: ${{ runner.temp }}/cerconexo-candidate
          CERCONEXO_FILE_AUDIT_OUT: ${{ github.workspace }}/validation/file-audit/candidate
          CERCONEXO_FILE_AUDIT_TAG: suite
        run: |
          node --require "$GITHUB_WORKSPACE/diagnostics/file-diagnostic.cjs" tests/phase5a.browser.cjs 2>&1 | tee "$CERCONEXO_FILE_AUDIT_OUT/suite.log"
      - name: Conservar diagnóstico, capturas y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-clasico-${{ github.run_id }}
          path: validation/file-audit/
          retention-days: 7
