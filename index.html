<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071A2F">
  <meta name="description" content="Elige Cerconexo Clásico o Arena: muros, estrategia y territorios conectados.">
  <title>Cerconexo · Clásico y Arena</title>
  <link rel="stylesheet" href="./src/portal.css">
</head>
<body>
<main class="portal" aria-label="Inicio de Cerconexo">
  <header class="portal-brand"><h1><img src="./assets/Cerconexo_logo_v3_transparente.png" alt="CERCONEXO" width="1224" height="1024"></h1></header>
  <section class="mode-grid" aria-label="Elige tu modalidad">
    <article class="mode-card" aria-labelledby="classicTitle" data-mode="classic">
      <div class="card-visual">
        <svg class="board-mini" viewBox="0 0 224 224" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="222" height="222" rx="8" fill="#F6EEDB" stroke="#D4A64A" stroke-width="2"/>
          <path d="M32 2v220m32-220v220m32-220v220m32-220v220m32-220v220m32-220v220M2 32h220M2 64h220M2 96h220M2 128h220M2 160h220M2 192h220" stroke="#CBBEAA" fill="none"/>
          <path d="M65 2v62h63v64h64M2 160h62v62" stroke="#475569" stroke-width="5" stroke-linejoin="round" fill="none"/>
          <g fill="#F59E0B" stroke="#102A43" stroke-width="2"><circle cx="48" cy="48" r="11"/><circle cx="176" cy="176" r="11"/></g>
          <g fill="#38BDF8" stroke="#102A43" stroke-width="2"><circle cx="176" cy="48" r="11"/><circle cx="48" cy="176" r="11"/></g>
        </svg>
        <span class="board-size">7 × 7</span>
      </div>
      <div class="card-copy"><div class="card-heading"><h2 id="classicTitle">CLÁSICO</h2><span class="mode-tag">El original</span></div>
        <p class="mode-description">Muros y estrategia territorial</p>
        <p class="save-status" data-save-status>Juego local o contra CPU</p>
        <nav class="card-actions" aria-label="Cerconexo Clásico">
          <a class="enter-mode" data-continue href="./clasico/?continue=1">Jugar <span aria-hidden="true">→</span></a>
          <a class="new-mode" data-new href="./clasico/?new=1" hidden>Nueva partida</a>
        </nav>
      </div>
    </article>
    <article class="mode-card arena-card" aria-labelledby="arenaTitle" data-mode="arena">
      <div class="card-visual">
        <svg class="board-mini" viewBox="0 0 252 252" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="250" height="250" rx="8" fill="#F6EEDB" stroke="#D4A64A" stroke-width="2"/>
          <path d="M28 2v248m28-248v248m28-248v248m28-248v248m28-248v248m28-248v248m28-248v248m28-248v248M2 28h248M2 56h248M2 84h248M2 112h248M2 140h248M2 168h248M2 196h248M2 224h248" stroke="#CBBEAA" fill="none"/>
          <path d="M84 2v82h56m0 0v56h56v84M2 168h82v82" fill="none" stroke="#475569" stroke-width="5" stroke-linejoin="round"/>
          <g fill="#F59E0B" stroke="#102A43" stroke-width="2"><circle cx="42" cy="42" r="10"/><circle cx="210" cy="210" r="10"/></g>
          <g fill="#38BDF8" stroke="#102A43" stroke-width="2"><circle cx="210" cy="42" r="10"/><circle cx="42" cy="210" r="10"/></g>
          <g fill="#102A43" stroke="#D4A64A"><rect x="60" y="60" width="20" height="20" rx="4"/><rect x="172" y="172" width="20" height="20" rx="4"/></g>
          <path d="M66 66h4v4h5m-8 5h7m103 102h9m-5-4v9m-4 3h9" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="board-size">9 × 9</span>
      </div>
      <div class="card-copy"><div class="card-heading"><h2 id="arenaTitle">ARENA</h2><span class="mode-tag experimental">Experimental</span></div>
        <p class="mode-description">Poderes, conquista y reconquista</p>
        <p class="save-status" data-save-status>2 vs. 2 o cuatro equipos</p>
        <nav class="card-actions" aria-label="Cerconexo Arena">
          <a class="enter-mode" data-continue href="./arena/?continue=1">Jugar <span aria-hidden="true">→</span></a>
          <a class="new-mode" data-new href="./arena/?new=1" hidden>Nueva partida</a>
        </nav>
      </div>
    </article>
  </section>
  <p class="portal-notice" id="portalNotice" role="status" hidden></p>
</main>
<script type="module" src="./src/portal.mjs"></script>
</body>
</html>
